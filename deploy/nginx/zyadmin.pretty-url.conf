# 星焰作业板管理后台 · 无 .html 后缀访问（部署到 /www/server/panel/vhost/nginx/extension/zyadmin.yanhuoyiyou.cn/pretty-url.conf）
# /classes -> classes.html，/notices -> notices.html，/ -> index.html（概览）

location = / {
    try_files /index.html =404;
}

# 旧地址重定向：/classes.html -> /classes（保留查询串）
location ~ ^/(classes|class|notices|users|devices|audit|login)\.html$ {
    return 301 /$1$is_args$args;
}

location ~ ^/(classes|class|notices|users|devices|audit|login)/?$ {
    try_files /$1.html =404;
}
