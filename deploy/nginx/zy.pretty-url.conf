# 星焰作业板 · 无 .html 后缀访问（部署到 /www/server/panel/vhost/nginx/extension/zy.yanhuoyiyou.cn/pretty-url.conf）
# /settings -> settings.html，/ -> index.html；旧的 xxx.html 地址 301 到干净地址

location = / {
    try_files /index.html =404;
}

# 旧地址重定向：/settings.html -> /settings（保留查询串）
location ~ ^/(welcome|bind|settings|list|exams|templates)\.html$ {
    return 301 /$1$is_args$args;
}

location ~ ^/(welcome|bind|settings|list|exams|templates)/?$ {
    try_files /$1.html =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
