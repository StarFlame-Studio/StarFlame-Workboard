<!-- 旧版 hash 路由兼容：/#/settings → /settings.html -->
<script>
  (function () {
    var hash = location.hash || ''
    if (hash.indexOf('#/') !== 0) return
    var path = hash.slice(2).split('?')[0].replace(/\/$/, '')
    var paramPart = hash.indexOf('?') !== -1 ? hash.slice(hash.indexOf('?')) : ''
    var map = {
      '': '/',
      bind: '/bind',
      settings: '/settings',
      list: '/list',
      exams: '/exams',
      templates: '/templates'
    }
    var target = map[path]
    if (!target) return
    location.replace(target + paramPart)
  })()
</script>
